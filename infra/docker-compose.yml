# Compose de desarrollo. Uso (desde la raíz del repo):
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up -d
name: caterin

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: ../.env
    ports:
      # 5433 en el host para no chocar con otro Postgres local; cambiar con POSTGRES_HOST_PORT
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.15
    volumes:
      - ollama:/root/.ollama
    # Sin puerto publicado: la API de Ollama no tiene autenticación (docs/SECURITY.md).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      args:
        INSTALL_DEV: "true"
    env_file: ../.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../apps/api:/app
      - apidata:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
  apidata:
  web_node_modules:
